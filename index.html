<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; }
  body {
    background:#0d0d0f; color:#eee;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:18px; padding:24px; text-align:center;
  }
  .badge { font-size:46px; }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; font-weight:600; }
  .sub { color:#888; font-size:14px; margin:0; max-width:320px; line-height:1.5; }
  .spin {
    width:26px; height:26px; border:3px solid #2a2a30; border-top-color:#e0b341;
    border-radius:50%; animation:s 0.8s linear infinite;
  }
  @keyframes s { to { transform:rotate(360deg); } }
  a { color:#e0b341; text-decoration:none; font-weight:600; }
  .manual { margin-top:8px; font-size:13px; color:#aaa; }
  .err { color:#ff6b6b; }
</style>
</head>
<body>
  <div class="badge">🛰️</div>
  <h1>MISSION CONTROL</h1>
  <div class="spin" id="spin"></div>
  <p class="sub" id="status">Finding the live console…</p>
  <p class="manual" id="manual"></p>
<script>
// This permanent page reads the current tunnel URL from url.txt (updated
// automatically whenever the tunnel rotates) and forwards you to it.
// Bookmark THIS page once — it always lands on the live console.
(async function () {
  const statusEl = document.getElementById('status');
  const manualEl = document.getElementById('manual');
  const spin = document.getElementById('spin');
  try {
    // cache-bust so we always get the freshest URL
    const res = await fetch('url.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('no url.txt');
    let url = (await res.text()).trim();
    if (!/^https?:\/\//.test(url)) throw new Error('bad url');
    statusEl.textContent = 'Opening the console…';
    manualEl.innerHTML = 'If it doesn\u2019t redirect, <a href="' + url + '">tap here</a>.';
    // small delay so the user sees the link before the bounce
    setTimeout(function () { window.location.replace(url); }, 400);
  } catch (e) {
    spin.style.display = 'none';
    statusEl.className = 'sub err';
    statusEl.textContent = 'Console URL not available yet.';
    manualEl.textContent = 'The tunnel may be restarting — refresh in a moment.';
  }
})();
</script>
</body>
</html>
